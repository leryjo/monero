<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XMR Miner (Personal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
    #s { background: #000; color: #0f0; padding: 14px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; min-height: 100px; }
    button { margin-top: 16px; padding: 14px 28px; font-size: 18px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <h2>Monero RandomX — Personal</h2>
  <div id="s">Loading...</div>
  <button id="go">START / RESUME MINING</button>

  <script defer crossorigin="anonymous"
    src="https://cdn.jsdelivr.net/gh/aa022/RandomX-bonanza@main/dist/embed.js"
    data-wallet="85KNrXfutegLDjeRiaBjkUVjCU2A3jkDq8s79A6M1dXg3dL4zZcNwh9UZkSL2HrGmZhoVuFru53mQH8MMz97nTzc47kk9kr"
    data-pool="gulf.moneroocean.stream"
    data-port="10128"
    data-proxy="wss://gxmail.dev"
    data-mode="full"
    data-workload="100"
    data-max-threads="4"
    data-worker-name="laptop1"
    data-headless="true"
    data-auto="false">
  </script>

  <script>
    const box = document.getElementById('s');
    const btn = document.getElementById('go');
    let rx = null;

    function show(t) { box.textContent = t; }

    window.addEventListener('randomx:ready', e => {
      rx = e.detail.instance;
      show('Siap. Klik tombol di bawah (sekali saja).');
    });

    window.addEventListener('randomx:error', e => {
      show('Error: ' + JSON.stringify(e.detail));
    });

    function startMining(ev) {
      if (!rx) { show('Belum siap...'); return; }
      show('Starting...');
      let ok = rx.start(ev);
      if (!ok) {
        rx.requestConsent(ev);
        rx.on('consent-request', d => {
          d.accept();
          show('Mining...');
        });
      }
    }

    btn.addEventListener('click', startMining);

    // Update status
    setInterval(() => {
      if (!rx?.state) return;
      const s = rx.state;
      if (s.phase === 'mining' || s.running) {
        show(
          'MINING\n' +
          'Hashrate : ' + (s.hashrate || 0) + ' H/s\n' +
          'Accepted : ' + (s.accepted || 0) + '\n' +
          'Rejected : ' + (s.rejected || 0) + '\n' +
          'Threads  : ' + (s.threads || '-') + '\n' +
          'CPU      : ' + (s.workload || '-') + '%'
        );
      }
    }, 2000);
  </script>
</body>
</html>
